[project]
name = "jarvis-backend"
version = "0.1.0"
description = "J.A.R.V.I.S. personal assistant — local-first FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.200",
  "uvicorn[standard]>=0.30,<0.60",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<0.29",
  "argon2-cffi>=23.1,<26",
  "psutil>=6,<8",
  "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
# Local speech-to-text. Heavy (CTranslate2 + PyAV); installed by scripts/setup-windows.ps1.
stt = ["faster-whisper>=1.1,<1.3", "av>=12,<17"]  # PyAV 19 rejects `metadata_errors`, which faster-whisper 1.2 passes (verified)
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:argon2"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
